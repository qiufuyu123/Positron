name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, Win32]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply patches
        shell: pwsh
        run: powershell -File patches/apply.ps1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'Win32' && 'x86' || 'x64' }}

      - name: CMake configure
        run: >
          cmake -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPOSITRON_BUILD_TESTS=OFF
          -DPOSITRON_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-ci --config Release

      - name: Collect artifacts
        shell: pwsh
        run: |
          $src = "build-ci"
          $dest = "positron-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $dest
          Get-ChildItem $src -Recurse -Include host.exe,payload.dll,positron_sdk.lib | ForEach-Object {
            Copy-Item $_.FullName $dest\
          }
          Copy-Item "sdk\include" "$dest\include" -Recurse
          Copy-Item "sdk\bootstrap.js" $dest\
          if (Test-Path "sdk\types") { Copy-Item "sdk\types" "$dest\types" -Recurse }

      - uses: actions/upload-artifact@v4
        with:
          name: positron-${{ matrix.arch }}
          path: positron-${{ matrix.arch }}/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: positron-x64
          path: positron-x64

      - uses: actions/download-artifact@v4
        with:
          name: positron-Win32
          path: positron-Win32

      - name: Package zips
        run: |
          cd positron-x64 && zip -r ../positron-x64.zip . && cd ..
          cd positron-Win32 && zip -r ../positron-Win32.zip . && cd ..

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            positron-x64.zip
            positron-Win32.zip
          generate_release_notes: true
